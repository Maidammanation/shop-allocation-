<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ShopApp</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="logo">Shop<span>App</span></a>
      <nav class="nav-links">
        <a href="../index.html">Shop</a>
        <a href="cart.html">Cart</a>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    <h1>Checkout</h1>
    <form id="checkout-form" style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem; margin-top: 1.5rem;">
      <div style="background: white; padding: 1.5rem; border-radius: 12px; border: 1px solid #e2e8f0;">
        <h2 style="margin-bottom: 1rem;">Shipping Information</h2>
        <div style="display: flex; flex-direction: column; gap: 1rem;">
          <input type="text" placeholder="Full Name" required style="padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px;">
          <input type="email" placeholder="Email Address" required style="padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px;">
          <input type="text" placeholder="Shipping Address" required style="padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <input type="text" placeholder="City" required style="padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px;">
            <input type="text" placeholder="Postal Code" required style="padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px;">
          </div>
        </div>
      </div>

      <div style="background: white; padding: 1.5rem; border-radius: 12px; border: 1px solid #e2e8f0; height: fit-content;">
        <h2 style="margin-bottom: 1rem;">Payment Method</h2>
        <p style="color: #64748b; margin-bottom: 1.5rem;">Payment processing integrated upon order submission.</p>
        <button type="submit" class="add-to-cart-btn">Place Order</button>
      </div>
    </form>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 ShopApp. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
